name: Build NekoRimba APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'frontend/**'
      - 'tools/**'
      - 'launcher/**'
      - 'linux/**'
      - 'windows/**'
      - 'tests/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bundle backend into Android app
        run: |
          mkdir -p android/app/src/main/python
          rm -rf android/app/src/main/python/backend
          cp -r backend android/app/src/main/python/
          rm -f android/app/src/main/python/backend/*.db android/app/src/main/python/backend/*.env
          find android/app/src/main/python/backend -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Decode keystore (if secrets are configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded - release APKs will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 not set - building DEBUG APKs only."
          fi

      - name: Build release APKs (signed)
        if: steps.keystore.outputs.available == 'true'
        working-directory: ./android
        env:
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APKs
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.available == 'true'
        run: |
          mkdir -p dist/android
          find android/app/build/outputs/apk -type f -name "nekorimba-*release-*.apk" -exec cp {} dist/android/ \;
          ls -lh dist/android/

      - name: Upload release APKs
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NekoRimba-Android-Release
          path: android/app/build/outputs/apk/**/release/*.apk

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: NekoRimba-Android-Debug
          path: android/app/build/outputs/apk/**/debug/*.apk

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/android/nekorimba-release-*.apk
            dist/android/nekorimba-tv-release-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
